# 本地一条命令起完整环境（app + PostgreSQL）：
#   cd server && docker compose up --build
# 正式部署同一份，改 .env 里的密码 / pepper，前面放 HTTPS 反向代理（见 DESIGN.md）。
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tribe
      POSTGRES_USER: tribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tribe-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tribe -d tribe"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      TRIBE_DATABASE_URL: postgresql+psycopg://tribe:${POSTGRES_PASSWORD:-tribe-dev-only}@db:5432/tribe
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
