<circle cx="46" cy="112" r="7" fill="#ffd23f" stroke-width="3"/>
<circle cx="82" cy="120" r="7" fill="#4fb3a6" stroke-width="3"/>
<circle cx="120" cy="123" r="7" fill="#ff7b22" stroke-width="3"/>
<circle cx="158" cy="120" r="7" fill="#4fb3a6" stroke-width="3"/>
<circle cx="194" cy="112" r="7" fill="#ffd23f" stroke-width="3"/>
<!-- 底部发光口 -->
<path d="M96 140Q120 158 144 140Z" fill="#c3ea7a" stroke-width="4"/>
</g>
<path d="M44 109a3 3 0 1 1 0 .1M118 120a3 3 0 1 1 0 .1M192 109a3 3 0 1 1 0 .1" fill="#fff" opacity=".8"/>
