<path d="M95 70Q96 58 109 62Q115 72 104 78Q96 79 95 70Z" fill="#2a1a10" stroke-width="2.5"/>
<path d="M145 70Q144 58 131 62Q125 72 136 78Q144 79 145 70Z" fill="#2a1a10" stroke-width="2.5"/>
<circle cx="102" cy="66" r="3.2" fill="#fff" stroke="none"/>
<circle cx="138" cy="66" r="3.2" fill="#fff" stroke="none"/>
<path d="M110 84Q120 92 130 84" fill="none" stroke-width="3.5"/>
<ellipse cx="96" cy="84" rx="5" ry="3" fill="#f39a7a" stroke="none" opacity=".7"/>
<ellipse cx="144" cy="84" rx="5" ry="3" fill="#f39a7a" stroke="none" opacity=".7"/>
<!-- 玻璃高光 -->
<path d="M76 70Q78 46 102 36" fill="none" stroke="#ffffff" stroke-width="6" opacity=".75"/>
<path d="M160 52Q166 60 167 70" fill="none" stroke="#ffffff" stroke-width="4" opacity=".55"/>
<!-- 碟身下层 -->
<path d="M18 104Q120 74 222 104L208 128Q120 156 32 128Z" fill="#b97a3f"/>
<path d="M40 128Q120 148 200 128" fill="none" stroke="#7a4a22" stroke-width="4"/>
